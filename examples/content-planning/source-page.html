  <h1>潮汐浮标：把海洋变成实时数据</h1>
  <p>一款新型潮汐观测浮标正在改变海洋数据的获取方式。</p>
  <p>浮标每 15 分钟上传一次海面温度与盐度数据，单次布放可连续工作 12 个月。</p>
  <p>数据通过卫星回传，延迟低于 5 分钟，研究团队可以在天气窗口关闭前完成决策。</p>
  <p>首批 24 台浮标已部署在南海，覆盖三个关键观测断面。</p>
  <p>与传统调查船相比，浮标网络的年度运维成本下降了 60%。</p>
